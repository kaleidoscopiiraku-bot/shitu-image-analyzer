<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>MiMo看图 · 连接此 Mac</title><style>body{margin:60px auto;max-width:520px;padding:24px;background:#f5f5f0;color:#23322e;font:16px system-ui}input{box-sizing:border-box;width:100%;padding:12px;margin:16px 0;border:1px solid #bfc8b8;border-radius:8px}button{padding:10px 18px;border:1px solid #bfc8b8;border-radius:8px;cursor:pointer;background:#d9f170;margin-right:8px}p{line-height:1.8}#status{min-height:30px}</style></head><body><h1>MiMo看图</h1><h2>连接这台 Mac</h2><p>打开 Mac 应用，在「MiMo看图」菜单选择「复制浏览器扩展配对码」，然后粘贴到这里。</p><label for="token">本机配对码</label><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="connect">连接</button><button id="disconnect">断开连接</button><p id="status" role="status"></p><p>配对码只保存在本机 Chrome 中，用于连接 127.0.0.1。请勿公开分享。</p><script src="options.js"></script></body></html>
