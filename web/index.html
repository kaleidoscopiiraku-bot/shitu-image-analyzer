<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾图 · 本地图片分析</title><link rel="stylesheet" href="/ui.css"></head><body><main id="inspector"></main><script src="/ui.js"></script><script>window.inspector=mountInspector(document.getElementById('inspector'),{native:!!window.webkit?.messageHandlers?.native,prepareChatGPT:(image,prompt)=>window.webkit.messageHandlers.native.postMessage({action:'chatgpt-web',value:{image,prompt}}),request:async(path,body)=>{const r=await fetch(path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+(window.__shituToken||location.hash.slice(1)),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'连接失败');return j;}});window.setSelectedImage=(data,name)=>window.inspector.analyze(data,name);</script></body></html>
